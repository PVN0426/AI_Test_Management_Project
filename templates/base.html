{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Test Management Platform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 font-sans antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <div class="flex h-screen overflow-hidden">
        {% include "components/sidebar.html" %}
        <div class="flex-1 flex flex-col overflow-y-auto bg-slate-50">
            <div class="p-4 pb-0">
                {% include "components/navbar.html" %}
            </div>
            <main class="p-6">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
    <div id="modal-container"></div>
    <script>
        document.body.addEventListener('htmx:responseError', function(evt) {
            if (evt.detail.xhr.status === 402) {
                alert('Tài khoản của bạn đã vượt quá hạn mức sử dụng AI trong tháng!');
            }
        });
    </script> <script src="{% static 'js/role-guard.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
