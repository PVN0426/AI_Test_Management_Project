<div
  id="bugFormModal"
  class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/50"
>
  <div class="min-h-screen flex items-center justify-center p-6 ml-64">
    <div class="w-full max-w-6xl bg-slate-50 rounded-2xl shadow-xl">
      <div class="px-6 py-6 border-b border-slate-200 bg-white rounded-t-2xl">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Log New Bug</h1>

            <p class="mt-1 text-sm text-slate-500">
              Report a new defect for this project.
            </p>
          </div>

          <div class="flex gap-3">
            <button
              type="button"
              id="cancelBugBtn"
              data-testid="bug-form-btn-cancel"
              class="px-4 py-2.5 rounded-xl border border-slate-200 text-sm text-slate-600 hover:bg-slate-50"
            >
              Cancel
            </button>

            <button
              type="button"
              id="saveBugBtn"
              data-testid="bug-form-btn-submit"
              class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-slate-700 text-white text-sm font-medium hover:bg-slate-800"
            >
              <i class="fa-regular fa-floppy-disk"></i>
              Save Bug
            </button>
          </div>
        </div>
      </div>

      <div class="p-6">
        <form id="bugForm" data-testid="bug-form">
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-5">
              <div
                class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm"
              >
                <label class="block text-sm font-medium text-slate-700 mb-3">
                  Bug Summary *
                </label>

                <input
                  id="bugSummary"
                  data-testid="bug-form-inp-summary"
                  type="text"
                  required
                  placeholder="Brief description of the defect"
                  class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>
              <div
                class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm"
              >
                <label class="block text-sm font-medium text-slate-700 mb-3">
                  Steps to Reproduce
                </label>
                <textarea
                  id="bugSteps"
                  data-testid="bug-form-textarea-steps"
                  rows="6"
                  placeholder="1. Go to login page&#10;2. Enter invalid email&#10;3. Click submit"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                ></textarea>
              </div>
              <div
                class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm"
              >
                <label class="block text-sm font-medium text-slate-700 mb-3">
                  Expected Result
                </label>
                <textarea
                  id="expectedResult"
                  data-testid="bug-form-textarea-expected"
                  rows="4"
                  placeholder="What should happen?"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                ></textarea>
              </div>
              <div
                class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm"
              >
                <label class="block text-sm font-medium text-slate-700 mb-3">
                  Actual Result
                </label>

                <textarea
                  id="actualResult"
                  data-testid="bug-form-textarea-actual"
                  rows="4"
                  placeholder="What actually happened?"
                  class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                ></textarea>
              </div>
              <div
                class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm"
              >
                <label class="block text-sm font-medium text-slate-700 mb-3">
                  Attachments
                </label>
                <div
                  id="uploadArea"
                  data-testid="bug-form-upload-area"
                  class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-400 hover:bg-slate-50 transition"
                >
                  <input
                    id="bugAttachment"
                    data-testid="bug-form-inp-attachment"
                    type="file"
                    accept="image/*,video/*"
                    multiple
                    class="hidden"
                  />

                  <i
                    class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400"
                  ></i>

                  <p class="mt-3 text-sm text-slate-600">
                    Drag & drop, click to browse, or paste (Ctrl + V)
                  </p>

                  <p class="mt-1 text-xs text-slate-400">
                    PNG, JPG, JPEG, GIF, WEBP, MP4, MOV (max 50MB each)
                  </p>
                </div>
                <div
                  id="fileList"
                  data-testid="bug-form-file-list"
                  class="mt-4 space-y-2"
                ></div>
              </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div>
              <div
                class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-5"
              >
                <h2 class="font-semibold text-slate-800">Classification</h2>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Platform *
                  </label>

                  <select
                    id="bugPlatform"
                    data-testid="bug-form-select-platform"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200"
                  >
                    <option value="web" selected>Web</option>
                    <option value="mobile">Mobile</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Priority
                  </label>

                  <select
                    id="bugPriority"
                    data-testid="bug-form-select-priority"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200"
                  >
                    <option value="critical">Critical</option>
                    <option value="high" selected>High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Severity
                  </label>

                  <select
                    id="bugSeverity"
                    data-testid="bug-form-select-severity"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200"
                  >
                    <option value="critical">Critical</option>
                    <option value="high" selected>High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Status
                  </label>

                  <select
                    id="bugStatus"
                    data-testid="bug-form-select-status"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200"
                  >
                    <option value="open" selected>Open</option>
                    <option value="in_progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                    <option value="reopened">Reopened</option>
                    <option value="closed">Closed</option>
                    <option value="rejected">Rejected</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Environment
                  </label>

                  <select
                    id="bugEnvironment"
                    data-testid="bug-form-select-environment"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200"
                  >
                    <option value="production">Production</option>
                    <option value="staging" selected>Staging</option>
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Assignee
                  </label>

                  <input
                    id="bugAssignee"
                    data-testid="bug-form-inp-assignee"
                    type="text"
                    placeholder="Will be assigned by QC/Admin"
                    disabled
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 cursor-not-allowed"
                  />

                  <p class="mt-2 text-xs text-slate-400">
                    QC/Admin will assign after reviewing.
                  </p>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Linked Test Case
                  </label>

                  <div class="relative">
                    <i
                      class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
                    ></i>

                    <input
                      id="linkedTestCase"
                      data-testid="bug-form-inp-linked-testcase"
                      type="text"
                      placeholder="Search by Case ID or Title..."
                      class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200"
                    />
                  </div>

                  <p class="mt-2 text-xs text-slate-400">
                    Only shows test cases from this project.
                  </p>
                </div>

                <div>
                  <label class="block text-xs font-medium text-slate-600 mb-2">
                    Linked Test Run ID
                  </label>

                  <input
                    id="linkedTestRun"
                    data-testid="bug-form-inp-linked-testrun"
                    type="text"
                    placeholder="e.g. RUN-001"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200"
                  />
                </div>
              </div>
            </div>
          </div>

          <div
            id="bugFormError"
            data-testid="bug-form-error"
            class="hidden mt-5 p-3 rounded-lg bg-rose-50 text-rose-600 text-sm"
          ></div>
        </form>
      </div>
    </div>
  </div>
  <!-- Toast -->
  <div
    id="bugToast"
    data-testid="bug-form-toast"
    class="hidden fixed right-6 bottom-6 z-50 px-5 py-3 rounded-xl shadow-lg bg-slate-900 text-white text-sm"
  ></div>
</div>
