<div
  id="aiPreviewModal"
  data-testid="requirement-list-modal-ai-preview"
  class="hidden fixed inset-0 z-[110] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center"
>
  <div
    class="w-full max-w-6xl max-h-[90vh] mx-4 bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden"
  >
    <div
      class="px-6 py-5 border-b border-slate-200 flex items-center justify-between"
    >
      <div>
        <h2 class="text-lg font-bold text-slate-900">
          AI Generated Test Cases
        </h2>
        <p id="aiPreviewCount" class="text-sm text-slate-500 mt-1">
          0 Test Cases generated
        </p>
      </div>
      <button
        type="button"
        id="closeAIPreviewBtn"
        data-testid="requirement-list-btn-close-ai-preview"
        class="w-9 h-9 rounded-lg hover:bg-slate-100 text-slate-500"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div
      id="aiPreviewContent"
      data-testid="requirement-list-modal-ai-preview-content"
      class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50"
    ></div>
    <div
    class="px-6 py-4 border-t border-slate-200 bg-white flex items-center justify-end gap-3"
>
    <button
        type="button"
        id="saveAIDraftBtn"
        data-testid="requirement-list-btn-save-ai-draft"
        class="px-5 py-2.5 border border-slate-300 text-slate-700 rounded-xl text-sm font-medium hover:bg-slate-50"
    >
        <i class="fa-solid fa-file"></i>
        Draft
    </button>

    <button
        type="button"
        id="confirmAISaveBtn"
        data-testid="requirement-list-btn-confirm-ai-save"
        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md flex items-center gap-2"
    >
        <i class="fa-solid fa-check"></i>
        Confirm & Save
    </button>
</div>
  </div>
</div>
