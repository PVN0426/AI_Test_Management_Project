<aside class="w-64 bg-[#0f172a] text-slate-300 flex flex-col h-screen select-none border-r border-slate-800">
    <!-- Logo / Title -->
    <div class="p-6 flex items-center space-x-3 border-b border-slate-800/80">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/30">
            <i class="fa-solid fa-bolt text-base"></i>
        </div>
        <span class="text-lg font-bold text-white tracking-wide">TestFlow</span>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
        <!-- 1. Dashboard -->
        <a href="/dashboard/" class="flex items-center justify-between px-4 py-3 rounded-xl {% if request.path == '/dashboard/' %}bg-indigo-600 text-white font-medium shadow-lg shadow-indigo-600/30{% else %}hover:bg-slate-800/60 text-slate-400 hover:text-white{% endif %} transition">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                <span class="text-sm">Dashboard</span>
            </div>
            {% if request.path == '/dashboard/' %}<span class="text-xs">›</span>{% endif %}
        </a>

        <!-- 2. Projects (Danh sách dự án) -->
        <a href="/projects/" class="flex items-center justify-between px-4 py-3 rounded-xl {% if '/projects/' in request.path %}bg-indigo-600 text-white font-medium shadow-lg shadow-indigo-600/30{% else %}hover:bg-slate-800/60 text-slate-400 hover:text-white{% endif %} transition">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-folder-open w-5 text-center"></i>
                <span class="text-sm">Projects List</span>
            </div>
        </a>

        <!-- 3. DANH SÁCH CÁC PROJECT CỤ THỂ (Sổ ra hoặc liệt kê nhanh tại đây nếu muốn) -->
        <div class="pt-4 pb-2">
            <div class="flex items-center justify-between px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                <span>Recent Projects</span>
                <a href="/projects/create/" class="hover:text-white transition" title="Create New Project">
                    <i class="fa-solid fa-plus"></i>
                </a>
            </div>
        </div>

        <div class="space-y-1">
            <!-- Ví dụ dùng vòng lặp Django template để render danh sách project từ Backend gửi sang -->
            {% for p in projects %}
            <a href="{% url 'project_workspace' p.id %}" class="flex items-center px-4 py-2.5 rounded-lg text-sm transition {% if current_project.id == p.id %}text-white font-semibold bg-slate-800/60 shadow{% else %}text-slate-400 hover:text-white hover:bg-slate-800/30{% endif %}">
                <i class="fa-solid fa-folder w-5 text-center mr-2 text-indigo-400"></i>
                <span class="truncate">{{ p.name }}</span>
            </a>
            {% empty %}
            <p class="px-4 text-xs text-slate-500 italic">Chưa có dự án nào.</p>
            {% endfor %}
        </div>
    </nav>

    <!-- Logout Button -->
    <div class="p-4 border-t border-slate-800/80">
        <form action="{% url 'logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-rose-500/10 hover:text-rose-500 transition text-sm font-medium text-slate-400 group cursor-pointer">
                <i class="fa-solid fa-arrow-right-from-bracket w-5 text-center mr-2 group-hover:text-rose-500 transition"></i>
                <span>Đăng xuất</span>
            </button>
        </form>
    </div>
</aside>
