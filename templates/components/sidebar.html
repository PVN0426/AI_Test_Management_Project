<aside
  class="w-64 bg-[#0f172a] text-slate-300 flex flex-col h-screen select-none border-r border-slate-800"
>
  <div class="p-6 flex items-center space-x-3 border-b border-slate-800/80">
    <div
      class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/30"
    >
      <i class="fa-solid fa-bolt text-base"></i>
    </div>
    <span class="text-lg font-bold text-white tracking-wide">TestFlow</span>
  </div>

  <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
    <!-- Projects List -->
    <a
      href="/projects/"
      data-testid="common-aside-link-projects"
      class="flex items-center justify-between px-4 py-3 rounded-xl hover:bg-slate-800/60 text-slate-400 hover:text-white transition"
    >
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-folder-open w-5 text-center"></i>
        <span class="text-sm">Projects List</span>
      </div>
    </a>
    <div class="space-y-1">
      <div class="ml-3 mt-3 space-y-1">
        <button
          type="button"
          id="current-project-toggle"
          class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg hover:bg-slate-800/60 text-slate-300 hover:text-white transition"
        >
          <div class="flex items-center space-x-3 min-w-0">
            <i
              class="fa-solid fa-folder-open w-5 text-center text-indigo-400"
            ></i>

            <span
              id="current-project-name"
              class="text-sm font-semibold truncate"
            >
              Project
            </span>
          </div>

          <i
            id="project-chevron"
            class="fa-solid fa-chevron-down text-xs transition-transform"
          ></i>
        </button>

        <!-- Project submenu -->
        <div
          id="project-submenu"
          class="hidden ml-5 pl-3 border-l border-slate-700 space-y-1"
        >
          <a
            href="#"
            data-project-menu="requirements"
            class="project-menu-item flex items-center px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800/60 transition"
          >
            <i class="fa-solid fa-file-lines w-5 text-center mr-2"></i>
            <span>Requirements</span>
          </a>

          <a
            href="#"
            data-project-menu="test-cases"
            class="project-menu-item flex items-center px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800/60 transition"
          >
            <i class="fa-solid fa-vials w-5 text-center mr-2"></i>
            <span>Test Cases</span>
          </a>

          <a
            href="#"
            data-project-menu="test-suites"
            class="project-menu-item flex items-center px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800/60 transition"
          >
            <i class="fa-solid fa-layer-group w-5 text-center mr-2"></i>
            <span>Test Suites</span>
          </a>

          <!-- <a
            href="#"
            data-project-menu="test-runs"
            class="project-menu-item flex items-center px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800/60 transition"
          >
            <i class="fa-solid fa-play w-5 text-center mr-2"></i>
            <span>Test Runs</span>
          </a> -->

          <a
            href="#"
            data-project-menu="bugs"
            class="project-menu-item flex items-center px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800/60 transition"
          >
            <i class="fa-solid fa-bug w-5 text-center mr-2"></i>
            <span>Bugs</span>
          </a>

          <a
            href="#"
            data-project-menu="reports"
            class="project-menu-item flex items-center px-3 py-2 rounded-lg text-sm text-slate-400 hover:text-white hover:bg-slate-800/60 transition"
          >
            <i class="fa-solid fa-chart-line w-5 text-center mr-2"></i>
            <span>Reports</span>
          </a>
        </div>
      </div>
      <!-- </div> -->
    </div>
  </nav>
  <div class="p-4 border-t border-slate-800/80">
    <button
      type="button"
      onclick="handleLogout()"
      data-testid="common-aside-btn-logout"
      class="w-full flex items-center px-4 py-3 rounded-xl hover:bg-rose-500/10 hover:text-rose-500 transition text-sm font-medium text-slate-400 group cursor-pointer"
    >
      <i
        class="fa-solid fa-arrow-right-from-bracket w-5 text-center mr-2 group-hover:text-rose-500 transition"
      ></i>
      <span>Đăng xuất</span>
    </button>
  </div>

  <script>
    function handleLogout() {
      localStorage.removeItem("access_token");
      localStorage.removeItem("refresh_token");
      localStorage.removeItem("current_project_id");
      localStorage.removeItem("current_project_name");

      window.location.href = "/";
    }

    document.addEventListener("DOMContentLoaded", function () {
      const projectId = localStorage.getItem("current_project_id");

      const projectName = localStorage.getItem("current_project_name");

      const currentPath = window.location.pathname;


      const projectNameElement = document.getElementById(
        "current-project-name",
      );

      if (projectNameElement) {
        projectNameElement.textContent = projectName || "Project";
      }

      const projectToggle = document.getElementById("current-project-toggle");

      const projectSubmenu = document.getElementById("project-submenu");

      const projectChevron = document.getElementById("project-chevron");

      if (projectToggle && projectSubmenu) {
        projectToggle.addEventListener("click", function () {
          projectSubmenu.classList.toggle("hidden");
          projectChevron.classList.toggle("rotate-180");
        });
        const isProjectPage =
          projectId && currentPath.startsWith(`/projects/${projectId}/`);

        if (isProjectPage) {
          projectSubmenu.classList.remove("hidden");
          projectChevron.classList.add("rotate-180");
        }
      }

      document.querySelectorAll("[data-project-menu]").forEach(function (menu) {
        const module = menu.dataset.projectMenu;

        if (currentPath.includes(`/${module}/`)) {
          menu.classList.remove(
            "text-slate-400",
            "hover:text-white",
            "hover:bg-slate-800/60",
          );

          menu.classList.add(
            "bg-indigo-600",
            "text-white",
            "font-medium",
            "shadow-lg",
            "shadow-indigo-600/30",
          );
        }

        menu.addEventListener("click", function (event) {
          event.preventDefault();

          if (!projectId) {
            alert("Vui lòng chọn một project trước.");
            return;
          }

          window.location.href = `/projects/${projectId}/${module}/`;
        });
      });
    });
  </script>
</aside>
