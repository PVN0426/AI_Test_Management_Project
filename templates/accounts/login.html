<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - AI Test Management Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-8 space-y-6">
        <!-- Tiêu đề -->
        <div class="text-center">
            <h2 class="text-2xl font-bold text-white">Đăng nhập hệ thống</h2>
            <p class="mt-2 text-sm text-slate-400">AI Test Management Platform</p>
        </div>

  
        <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/50 p-3 rounded-lg">
            <p id="errorMessage" class="text-sm text-red-400 text-center"></p>
        </div>

        <!-- Form đăng nhập -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-300 mb-1">Tên đăng nhập</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="Nhập tên đăng nhập của bạn">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Mật khẩu</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm"
                    placeholder="••••••••">
            </div>

       
            <button type="submit" id="submitBtn"
                class="w-full py-2.5 px-4 rounded-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-150 shadow-lg shadow-indigo-600/30">
                Đăng nhập
            </button>
        </form>
    </div>
    {% load static %}
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
